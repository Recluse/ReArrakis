name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDL2 and C++ dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev pkg-config g++
      - name: Test translation, runtime and Dune adapters without a ROM
        run: make test
      - name: Build and execute synthetic ROM
        run: make demo

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDL2 dependencies
        run: brew install pkgconf sdl2-compat
      - name: Test translation, runtime and Dune adapters without a ROM
        run: make test
      - name: Build and execute synthetic ROM
        run: make demo
