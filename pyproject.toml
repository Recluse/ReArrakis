[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rearrakis"
version = "0.1.0"
description = "Native Dune: The Battle for Arrakis recompilation for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.urls]
Repository = "https://github.com/kruzeman/ReArrakis"
Issues = "https://github.com/kruzeman/ReArrakis/issues"

[project.scripts]
rearrakis-recompile = "genesis_recompiler.cli:main"

[tool.setuptools.packages.find]
include = ["genesis_recompiler*"]

[tool.setuptools.package-data]
genesis_recompiler = ["*.h", "*.cpp", "ymfm/*"]
